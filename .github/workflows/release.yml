name: Release

# Builds a universal "Owlink.app", signs it with the owner's Developer ID
# (hardened runtime, secure timestamp; llama.framework first, then the app),
# notarizes and staples it, Sparkle-signs the zip and writes a signed
# appcast.xml for it, and attaches Owlink-<version>.zip and appcast.xml to the
# GitHub Release for the tag. Every release it makes is a DRAFT (final tags
# too): the owner publishes it by hand. A tag with a suffix (v0.1.0-rc1) is
# also a prerelease. Nothing is uploaded to owlink.app: the owner puts
# appcast.xml at https://owlink.app/appcast.xml by hand after publishing.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   CERT_P12_BASE64    base64 of the exported "Developer ID Application" .p12
#   CERT_P12_PASSWORD  that .p12's password
#   NOTARY_APPLE_ID    Apple ID used for notarization
#   NOTARY_TEAM_ID     10-character Team ID
#   NOTARY_PASSWORD    app-specific password from appleid.apple.com
#   SPARKLE_ED_PRIVATE_KEY  the Sparkle EdDSA private key, as exported by
#                      `generate_keys -x` (base64 of the 32-byte seed). Written
#                      only to a mode-600 temp file under $RUNNER_TEMP, checked
#                      against the committed public key before anything is
#                      signed, and deleted in an `if: always()` step.
#
# Only this workflow (and the dispatch-only verify-sparkle-key.yml) gets
# SPARKLE_ED_PRIVATE_KEY; it runs on tags and by hand, never on pull requests.
#
# The signing and notarizing steps are Scripts/release.sh, the same script
# the owner can run locally. Same pipeline as Tankard's.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to (e.g. v0.1.0)"
        required: true

permissions: {}

jobs:
  release:
    runs-on: macos-26   # macOS 26 SDK: the Apple Intelligence engine (FoundationModels) compiles in; tests.yml uses the same runner
    timeout-minutes: 90
    permissions:
      contents: write  # create the release and upload Owlink-<version>.zip
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check secrets
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=""
          for s in CERT_P12_BASE64 CERT_P12_PASSWORD NOTARY_APPLE_ID NOTARY_TEAM_ID NOTARY_PASSWORD SPARKLE_ED_PRIVATE_KEY; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings → Secrets and variables → Actions (see docs/architecture.md, 'Signing a release')."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ env.TAG }}

      - name: Toolchain
        run: swift --version && sw_vers && xcode-select -p && echo "macOS SDK $(xcrun --show-sdk-version) (Apple Intelligence engine needs 26+)"

      # Fails the release when CHANGELOG.md has no section for the tag, so a
      # release never ships without its list of changes.
      - name: Release notes from CHANGELOG.md
        run: |
          Scripts/changelog-section.sh --self-test
          {
            echo "Owlink ${TAG}: a fast, native text editor for macOS 14 Sonoma and later (universal: Intel and Apple silicon). Signed with Developer ID and notarized."
            echo
            BASE="${TAG#v}"; BASE="${BASE%%-*}"   # v0.1.0-rc1 -> 0.1.0
            Scripts/changelog-section.sh "$BASE"
            echo
            echo "Install: download \`Owlink-${BASE}.zip\`, open it, and move Owlink to Applications."
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      # See tests.yml: the llama.cpp binary target, cached, fetched with a
      # timeout and retries.
      - name: Cache SwiftPM binary artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm/artifacts
          key: spm-artifacts-${{ runner.os }}-${{ hashFiles('Package.swift') }}

      - name: Resolve packages (timeout and retry)
        timeout-minutes: 20
        run: |
          for i in 1 2 3; do
            if perl -e 'alarm shift; exec @ARGV' 300 swift package resolve; then exit 0; fi
            echo "::warning::swift package resolve: try $i failed or took over 5 minutes"
            sleep 15
          done
          echo "::error::swift package resolve failed 3 times (the llama.cpp binary target?)"
          exit 1

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c  # v7
        with:
          p12-file-base64: ${{ secrets.CERT_P12_BASE64 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}

      - name: Tests
        run: Scripts/test.sh

      - name: Build, sign, notarize, staple
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          V="${TAG#v}"; export CEDRIC_VERSION="${V%%-*}"
          ./Scripts/release.sh

      # Apple's notarization answer and log, kept also when the step above
      # failed (an Invalid submission's issues list is in the log). Apple's
      # log has no credentials: id, status, archive name, sha256, cdhashes
      # and the issues. Nothing to upload when the run stopped before
      # notarizing.
      - name: Keep the notarization log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: notary-${{ env.TAG }}
          path: |
            dist/notary-result.json
            dist/notary-log.json
          if-no-files-found: ignore
          retention-days: 90

      # Launch the zip that ships: Scripts/smoke-launch.sh unzips the exact
      # dist/Owlink-<version>.zip the next step uploads into a fresh temp
      # folder, checks the bundle's layout, hides this checkout's Resources
      # and .build (the app's #filePath resource fallbacks, and any SwiftPM
      # Bundle.module build path, which would mask a zip missing its files on
      # the machine that built it), runs the llama.framework check, keeps the
      # app up for 10 s, quits it with a Quit event and fails on any new
      # Cedric crash report. release.sh's launch-check runs the app before
      # notarizing and zipping, with the checkout in place; this is the
      # clean-machine check of the artifact itself, so a broken zip never
      # reaches a draft (First Light 1.0.1 passed every signature check and
      # crashed at launch on users' Macs: d4rkwyng/first-light#22).
      - name: Launch smoke test
        run: |
          set -euo pipefail
          V="${TAG#v}"; ZIP="dist/Owlink-${V%%-*}.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::$ZIP is missing; \"Build, sign, notarize, staple\" did not finish."
            ls -la dist || true
            exit 1
          fi
          # A release gate (it launches the release binary as shipped, which
          # uses this account's real Application Support): allowed here
          # because the runner is a disposable VM.
          OWLINK_RELEASE_GATE=1 Scripts/smoke-launch.sh --seconds 10 "$ZIP"

      # The Sparkle update (docs/updates.md): the same steps as
      # `Scripts/release.sh --appcast`, run on the zip that was just
      # notarized and smoke-tested. The private key goes to a mode-600 file
      # in a private folder under $RUNNER_TEMP (outside the checkout); this
      # step is the only one that sees the secret. Before anything is
      # signed, the key's public half must be the committed one
      # (Scripts/sparkle-defaults.sh), or the job stops. No set -x here,
      # and nothing prints the key or the file.
      - name: Sparkle key (temp file, checked against the committed public key)
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x +v
          umask 077
          KEYDIR="$RUNNER_TEMP/sparkle-key"
          rm -rf "$KEYDIR"
          mkdir -m 700 "$KEYDIR"
          # printf is a shell builtin: the key is never on a command line.
          printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" > "$KEYDIR/ed25519.key"
          chmod 600 "$KEYDIR/ed25519.key"
          unset SPARKLE_ED_PRIVATE_KEY
          . Scripts/sparkle-defaults.sh
          DERIVED=$(swift Scripts/sparkle-public-key.swift "$KEYDIR/ed25519.key") || {
            echo "::error::SPARKLE_ED_PRIVATE_KEY is not a Sparkle ed25519 key file (base64 of a 32-byte seed, from generate_keys -x)."
            exit 1
          }
          if [ "$DERIVED" != "$OWLINK_SPARKLE_PUBLIC_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY's public key is $DERIVED, not the committed $OWLINK_SPARKLE_PUBLIC_KEY (Scripts/sparkle-defaults.sh). Installed copies would refuse anything it signs; nothing was signed."
            exit 1
          fi
          echo "Sparkle key matches the committed public key $OWLINK_SPARKLE_PUBLIC_KEY"

      # Sign the zip (sign_update --ed-key-file), check its length and the
      # signature against the committed public key (Scripts/ed-verify.swift),
      # then write, sign and verify dist/appcast.xml as a new feed with this
      # one item (Scripts/appcast-item.sh). The enclosure URL is this tag's
      # GitHub release asset; for an rc tag that is the rc's own release.
      - name: Sparkle-sign the zip and write appcast.xml
        run: |
          set -euo pipefail
          KEYFILE="$RUNNER_TEMP/sparkle-key/ed25519.key"
          V="${TAG#v}"; VERSION="${V%%-*}"
          ZIP="dist/Owlink-${VERSION}.zip"
          [ -f "$ZIP" ] || { echo "::error::$ZIP is missing"; exit 1; }
          . Scripts/sparkle-defaults.sh
          SIGN_UPDATE=$(find .build/artifacts -maxdepth 5 -type f -path '*Sparkle*/bin/sign_update' 2>/dev/null | head -1)
          [ -n "$SIGN_UPDATE" ] && [ -x "$SIGN_UPDATE" ] || { echo "::error::no Sparkle sign_update under .build/artifacts"; exit 1; }
          ENCLOSURE="https://github.com/d4rkwyng/owlink/releases/download/${TAG}/Owlink-${VERSION}.zip"
          ATTRS=$("$SIGN_UPDATE" --ed-key-file "$KEYFILE" "$ZIP") || { echo "::error::sign_update could not sign $ZIP"; exit 1; }
          ED_SIG=$(sed -n 's/.*sparkle:edSignature="\([A-Za-z0-9+/=]*\)".*/\1/p' <<<"$ATTRS")
          ED_LEN=$(sed -n 's/.*length="\([0-9]*\)".*/\1/p' <<<"$ATTRS")
          if [ -z "$ED_SIG" ] || [ "$ED_LEN" != "$(stat -f '%z' "$ZIP")" ]; then
            echo "::error::sign_update's output isn't a signature and length for $ZIP: $ATTRS"
            exit 1
          fi
          swift Scripts/ed-verify.swift "$OWLINK_SPARKLE_PUBLIC_KEY" "$ED_SIG" "$ZIP" || {
            echo "::error::the zip's signature doesn't verify with the committed public key"
            exit 1
          }
          rm -f dist/appcast.xml
          Scripts/appcast-item.sh --out dist/appcast.xml --sign-update "$SIGN_UPDATE" \
            --version "$VERSION" --url "$ENCLOSURE" --length "$ED_LEN" --signature "$ED_SIG" \
            -- --ed-key-file "$KEYFILE"
          SHA=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)
          echo "sha256 $SHA  $ZIP"
          {
            echo "### Owlink ${VERSION} (${TAG})"
            echo
            echo "- \`Owlink-${VERSION}.zip\` sha256 \`$SHA\`, ${ED_LEN} bytes"
            echo "- Sparkle edSignature \`$ED_SIG\` (verified with \`$OWLINK_SPARKLE_PUBLIC_KEY\`)"
            echo "- Enclosure: $ENCLOSURE"
            echo "- \`appcast.xml\` (signed) is attached to the draft. Not uploaded to $OWLINK_SPARKLE_FEED_URL: do that by hand after publishing the release."
          } >> "$GITHUB_STEP_SUMMARY"

      # The key file goes whether signing worked, failed or never ran.
      - name: Delete the Sparkle key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/sparkle-key"

      - name: Upload to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/Owlink-*.zip
            dist/appcast.xml
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-notes.md
          # Always a draft, final tags included: nothing is public (or
          # "latest" for the cask) until the owner publishes it by hand.
          # A tag with a suffix (v0.1.0-rc1) is a test build: also a prerelease.
          draft: true
          prerelease: ${{ contains(env.TAG, '-') }}
